# FortressStack admin frontend — nginx SPA server.
# Serves the built Vite bundle and reverse-proxies /api to the FastAPI admin
# backend so the browser only ever talks to one origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — route all client-side paths to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the admin backend service.
    location /api/ {
        proxy_pass http://admin-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets aggressively (fingerprinted by Vite).
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}