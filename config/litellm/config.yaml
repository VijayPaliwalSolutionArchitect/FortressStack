# LiteLLM gateway config — per-team keys, budgets, model routing & fallbacks.
# FortressStack routes every LLM call through this gateway so budgets and
# governance are enforced in ONE place, not scattered across apps.

model_list:
  # Local models served by Ollama. Add more as you pull them.
  - model_name: llama3.1:8b
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://ollama:11434
    model_info:
      mode: completion
      supports_function_calling: false

  - model_name: qwen2.5:7b
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434
    model_info:
      mode: completion

  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
    model_info:
      mode: embedding

# Per-team budgets enforced at the gateway. The admin backend mirrors these
# in its own `teams` table for the audit trail.
litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 60
  fallbacks:
    - {"llama3.1:8b": ["qwen2.5:7b"]}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# Teams & budgets (mirror of admin backend). Add/remove via the admin console.
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2

# Per-team keys & budgets
team_settings:
  - team_id: default
    team_alias: Default
    max_budget: 50.0
    rpm_limit: 60
    models: ["llama3.1:8b", "qwen2.5:7b", "nomic-embed-text"]